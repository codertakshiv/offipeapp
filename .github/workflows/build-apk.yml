name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        type: choice
        options:
          - debug
          - release
          - both
        default: 'both'
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: r27c
          cmdline-tools-version: latest
          build-tools-version: '34.0.0'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        if: ${{ inputs.build_type == 'debug' || inputs.build_type == 'both' }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        if: ${{ inputs.build_type == 'release' || inputs.build_type == 'both' }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Find all APKs
        run: |
          echo "=== Finding all APK files ==="
          find . -name "*.apk" -type f 2>/dev/null | head -50
          echo "=== Build outputs directory ==="
          find app/build/outputs -type f -name "*.apk" 2>/dev/null | head -50
          echo "=== Debug APK dir ==="
          ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "Debug dir not found"
          echo "=== Release APK dir ==="
          ls -la app/build/outputs/apk/release/ 2>/dev/null || echo "Release dir not found"

      - name: Upload Debug APK
        if: ${{ inputs.build_type == 'debug' || inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: offipe-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/**/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Release APK
        if: ${{ inputs.build_type == 'release' || inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: offipe-release-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/**/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Debug Test APK
        if: ${{ inputs.build_type == 'debug' || inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: offipe-debug-test-apk
          path: |
            app/build/outputs/apk/androidTest/debug/*.apk
            app/build/outputs/apk/androidTest/debug/**/*.apk
          retention-days: 30
          if-no-files-found: ignore