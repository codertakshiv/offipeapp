name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        type: choice
        options:
          - debug
          - release
          - both
        default: 'debug'
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK licenses
        run: |
          # Use the pre-installed sdkmanager (already in PATH via ANDROID_HOME)
          yes | sdkmanager --licenses

      - name: Install required SDK packages
        run: |
          # Install only required packages - NO obsolete 'tools' package
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Find all APKs
        run: |
          echo "=== Finding all APK files ==="
          find . -name "*.apk" -type f 2>/dev/null | head -50
          echo "=== Build outputs directory ==="
          find app/build/outputs -type f -name "*.apk" 2>/dev/null | head -50

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: offipe-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/**/*.apk
          retention-days: 30
          if-no-files-found: warn